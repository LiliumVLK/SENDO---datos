<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>SENDO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Poppins:ital,wght@0,300;0,400;0,500;1,300&display=swap">
<script>try{const m=localStorage.getItem("sendo.theme");if(m==="dark"||m==="light")document.documentElement.dataset.theme=m}catch(e){}</script>
<style>
:root{
  --bg:#f3f5f4;--surface:#ffffff;--sunk:#e8ecea;--line:#d5dcd8;
  --fg:#16211d;--muted:#5d6b65;--accent:#1f6b5a;--accent-ink:#ffffff;--accent-soft:#d9ebe5;
  --warn:#b7791f;--danger:#c2412d;
  --display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --round:"Poppins",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);--grow:cubic-bezier(.2,.8,.25,1.08);
  --lift:0 1px 2px rgba(20,30,25,.06),0 8px 24px -12px rgba(20,30,25,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1513;--surface:#17201d;--sunk:#1d2824;--line:#2b3833;
  --fg:#e6ece9;--muted:#93a39c;--accent:#5cc2a6;--accent-ink:#0b1a15;--accent-soft:#1d3a32;
  --warn:#e2ab4f;--danger:#ef7a63;--lift:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513;--surface:#17201d;--sunk:#1d2824;--line:#2b3833;
  --fg:#e6ece9;--muted:#93a39c;--accent:#5cc2a6;--accent-ink:#0b1a15;--accent-soft:#1d3a32;
  --warn:#e2ab4f;--danger:#ef7a63;--lift:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);color-scheme:dark}
/* ===== Diario del cliente: paleta «Vino · Lavanda» (oscuro cálido, claro frío) ===== */
body.inside{--bg:#f4f3fd;--surface:#fdfcff;--sunk:#e9e7fa;--line:#d9d5f3;--fg:#1d1a3a;--muted:#67638f;--accent:#6b5cf0;--accent-ink:#ffffff;--accent-soft:#e5e1fd;--accent2:#3fa8f0;--accent3:#e46fc6}
:root[data-theme="dark"] body.inside{--bg:#14090c;--surface:#20111a;--sunk:#2b1722;--line:#3e2230;--fg:#f6e6ea;--muted:#bd97a4;--accent:#f06b8a;--accent-ink:#1c070d;--accent-soft:#3d1724;--accent2:#ff9e5e;--accent3:#b04fd6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body.inside{--bg:#14090c;--surface:#20111a;--sunk:#2b1722;--line:#3e2230;--fg:#f6e6ea;--muted:#bd97a4;--accent:#f06b8a;--accent-ink:#1c070d;--accent-soft:#3d1724;--accent2:#ff9e5e;--accent3:#b04fd6}}
body.inside{background:radial-gradient(120% 60% at 0% 0%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 60%),radial-gradient(90% 50% at 100% 35%,color-mix(in srgb,var(--accent2) 16%,transparent),transparent 65%),radial-gradient(100% 60% at 30% 110%,color-mix(in srgb,var(--accent3) 16%,transparent),transparent 60%),var(--bg);background-attachment:fixed}
body.inside .tabs-ind{background:linear-gradient(135deg,var(--accent),var(--accent2))}
body.inside .sec{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 9%,var(--surface)),var(--surface) 160px);border-color:color-mix(in srgb,var(--accent) 22%,var(--line))}
body.inside .wkrow.today{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 24%,var(--surface)),color-mix(in srgb,var(--accent2) 12%,var(--surface)))}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;min-height:100svh}
/* fondo interior: el mismo lienzo de raíces de la animación se queda como fondo */
.rootsbg{position:fixed;inset:0;z-index:-1;width:100%;height:100%;display:block;pointer-events:none;transition:opacity .9s var(--ease)}
.rootsbg.dim{opacity:.1}
.veil{position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:0;transition:opacity .9s var(--ease)}
/* entrada «Savia que escribe»: el diario ya está colocado pero invisible hasta que la savia lo escribe */
body.sapping .wrap>*:not(.cover),body.sapping .corner{opacity:0}
body.sapped .corner{transition:opacity .6s .3s var(--ease)}
/* la portada se queda un instante con el logotipo brillando antes de irse */
.cover.sv-out{opacity:0;transition:opacity .45s .3s var(--ease)}
.cover.sv-out .logo{transform-origin:48.8% 38.3%}
.cover.sv-out .tag,.cover.sv-out .enter,.cover.sv-out .acc-dev,.cover.sv-out .langsw{opacity:0;transition:opacity .25s}
body.sapped .wrap>*:not(.cover){transition:opacity .6s var(--ease)}
.saviafx{position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none}
:root[data-theme="dark"] .rootsbg{filter:invert(1)}:root[data-theme="dark"] .rootsbg.dim{opacity:.13}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rootsbg{filter:invert(1)}:root:not([data-theme="light"]) .rootsbg.dim{opacity:.13}}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 60px;display:flex;flex-direction:column;gap:16px}
[hidden]{display:none!important}

/* ===== esquina: casita y claro/oscuro ===== */
.corner{position:fixed;z-index:20;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px}
.corner button{width:40px;height:40px;padding:0;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);box-shadow:var(--lift);transition:transform .25s var(--ease)}
.corner button:active{transform:scale(.9)}
.corner svg{width:19px;height:19px}
body.home #btnHome{display:none}

/* ===== portada: logotipo SENDO ===== */
.cover{--cbg:#fff;--cink:#000;position:relative;isolation:isolate;overflow:hidden;min-height:calc(100svh - 32px);border-radius:30px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(20px,4svh,40px);text-align:center;
  padding:76px 22px max(30px,env(safe-area-inset-bottom,0px));background:var(--cbg);color:var(--cink);font-family:var(--round);
  border:1px solid color-mix(in srgb,var(--cink) 8%,transparent);box-shadow:0 30px 60px -34px rgba(0,0,0,.35);
  transition:transform .7s var(--ease),opacity .5s,background-color .5s,color .5s}
:root[data-theme="dark"] .cover,:root[data-theme="dark"] .acc{--cbg:#000;--cink:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cover,:root:not([data-theme="light"]) .acc{--cbg:#000;--cink:#fff}}
body.inside .cover,body.locked .cover{display:none}
body.svkeep .cover{display:flex!important}
body.svkeep .dpage{animation:none}
body.waiting .cover{visibility:hidden}
/* ===== acceso: bienvenida la primera vez ===== */
.acc{--cbg:#fff;--cink:#000;position:relative;min-height:calc(100svh - 32px);border-radius:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;
  padding:76px 24px 104px;background:var(--cbg);color:var(--cink);font-family:var(--round);border:1px solid color-mix(in srgb,var(--cink) 8%,transparent);box-shadow:0 30px 60px -34px rgba(0,0,0,.35);animation:accIn .8s var(--ease) both}
@keyframes accIn{from{opacity:0;transform:scale(.82)}}
.acc .mini{width:clamp(170px,50vw,270px);height:auto;fill:var(--cink);margin-bottom:10px}
.acc-body{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;animation:accIn .6s var(--ease) both}
.acc-h{font:400 1.12rem/1.3 var(--round);letter-spacing:.2em;text-transform:uppercase;margin:0}
.acc-p{margin:0;max-width:34ch;font-size:.92rem;line-height:1.6;color:color-mix(in srgb,var(--cink) 62%,transparent)}
.acc-f{display:flex;flex-direction:column;gap:4px;width:100%;max-width:280px;margin-top:6px;text-align:left}
.acc-f span{font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:color-mix(in srgb,var(--cink) 55%,transparent)}
.acc-f input{font:300 1.1rem var(--round);color:var(--cink);background:transparent;border:0;border-bottom:1.5px solid color-mix(in srgb,var(--cink) 30%,transparent);padding:9px 2px;border-radius:0;outline:none;transition:border-color .3s;width:100%}
.acc-f input:focus{border-color:var(--cink)}
.acc-go{margin-top:8px;min-height:48px;padding:0 26px;border-radius:999px;border:0;background:var(--cink);color:var(--cbg);font:500 .78rem var(--round);letter-spacing:.2em;text-transform:uppercase;transition:transform .25s var(--ease),opacity .2s}
.acc-go:active{transform:scale(.96)}.acc-go:disabled{opacity:.45}
.acc-go:focus-visible,.acc-ghost:focus-visible,.acc-dev:focus-visible{outline:2px solid var(--cink);outline-offset:4px}
.acc-ghost{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid color-mix(in srgb,var(--cink) 25%,transparent);background:none;color:var(--cink);font:500 .72rem var(--round);letter-spacing:.16em;text-transform:uppercase}
.acc-dev{position:absolute;left:50%;bottom:max(22px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);min-height:44px;padding:0 16px;border:0;background:none;
  font:400 .68rem var(--round);letter-spacing:.22em;text-transform:uppercase;color:color-mix(in srgb,var(--cink) 50%,transparent);white-space:nowrap;transition:color .2s}
.acc-dev:hover{color:var(--cink)}
.acc-dev::before{content:"";display:block;width:28px;height:1px;margin:0 auto 10px;background:currentColor;opacity:.5}
.dots{display:flex;gap:7px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--cink);animation:dot 1.4s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:none}}
/* ===== página de gestión de cuentas ===== */
body.dev .cover{display:none}
.dpage{display:flex;flex-direction:column;gap:14px;padding-top:4px;animation:accIn .6s var(--ease) both}
.dp-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:6px 56px 4px 2px}
.dp-logo{width:72px;height:auto;fill:var(--fg);flex:none}
.dp-tt{flex:1;min-width:140px}
.dp-head h1{font:700 2.1rem/1 var(--display);margin:0}
.dp-head p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.dp-search input{width:100%;font:400 1rem var(--body);padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.dp-search input:focus{outline:2px solid color-mix(in srgb,var(--accent) 50%,transparent);border-color:var(--accent)}
.dp-list{display:flex;flex-direction:column;gap:10px}
.acard{display:grid;grid-template-columns:46px minmax(0,1fr);gap:4px 14px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--lift);transform-origin:38px 50%;animation:accIn .56s var(--grow) both}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font:700 .95rem var(--body);font-style:normal;grid-row:span 2}
.ainfo{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ainfo b{font:700 1.2rem/1.15 var(--display);overflow-wrap:anywhere}
.ainfo small{color:var(--muted);font-size:.78rem}
.pw{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pw .lbl{font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);width:100%}
.pw code{font:500 .98rem ui-monospace,SFMono-Regular,Menlo,monospace;padding:7px 11px;border-radius:10px;background:var(--sunk);letter-spacing:.05em;overflow-wrap:anywhere;min-height:36px;display:inline-flex;align-items:center}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;padding:0;flex:none}
.ib svg{width:17px;height:17px}
.aact{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px;margin-top:8px}
.aact .primary,.aact .ghost{padding:8px 16px;font-size:.85rem}
.dp-empty{padding:30px 18px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:20px;margin:0}
.dp-note{color:var(--muted);font-size:.84rem;text-align:center;margin:4px auto 0;max-width:46ch}
.dp-exit{align-self:center;min-height:44px}
.pwrow{display:flex;gap:8px}.pwrow input{flex:1;font-family:ui-monospace,SFMono-Regular,Menlo,monospace!important;letter-spacing:.04em}
.pwrow .ghost{flex:none}
.acc-f+.acc-f{margin-top:0}
.acc-f .eye{align-self:flex-end;border:0;background:none;color:color-mix(in srgb,var(--cink) 55%,transparent);font:500 .66rem var(--round);letter-spacing:.18em;text-transform:uppercase;padding:6px 2px;min-height:32px}
/* ===== PDFs: plan individual e información general ===== */
.up{position:relative;width:52px;height:52px;flex:none;border-radius:16px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;padding:0;box-shadow:0 6px 16px -8px color-mix(in srgb,var(--accent) 70%,transparent);transition:transform .25s var(--ease)}
.up svg{width:30px;height:30px}
.up:active{transform:scale(.93)}
.up:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.up.busy{pointer-events:none}.up.busy svg{opacity:.25}
.up.busy::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gen{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--lift);padding:16px}
.gen-h{display:flex;align-items:center;gap:14px}
.gen-tt{flex:1}.gen-tt h2{font:700 1.45rem/1.05 var(--display)}.gen-tt p{margin:3px 0 0;color:var(--muted);font-size:.88rem}
.dp-sub{font:700 1.45rem/1.05 var(--display);margin:8px 2px -2px}
.plist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.prow{display:flex;align-items:center;gap:8px}
/* pestaña de vista previa: arriba, en la fila de los botones, y fija al hacer scroll (el de inicio se oculta: solo se sale con la ✕) */
body.pv #btnHome{display:none}
.pvbar{position:fixed;z-index:14;top:calc(env(safe-area-inset-top,0px) + 82px);left:max(16px,env(safe-area-inset-left,0px));height:42px;max-width:calc(100% - 92px);
  display:flex;align-items:center;gap:8px;padding:3px 3px 3px 13px;border-radius:999px;background:var(--surface);color:var(--fg);border:1px solid var(--line);
  box-shadow:0 10px 26px -10px rgba(0,0,0,.5);overflow:hidden;transform-origin:left center;animation:pvIn .56s var(--grow) both;
  transition:background .35s var(--ease),border-color .35s var(--ease),color .35s var(--ease)}
.pvbar.out{animation:pvOut .25s var(--ease) forwards}
.pvbar::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 30%,color-mix(in srgb,var(--accent) 35%,transparent) 50%,transparent 70%);transform:translateX(-120%)}
.pvbar.flip::after{animation:pvSweep .8s var(--ease)}
.pvbar.on{background:color-mix(in srgb,var(--accent) 22%,var(--surface));border-color:color-mix(in srgb,var(--accent) 70%,transparent)}
.pv-dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent);animation:pvDot 2s ease-out infinite}
.pvbar.on .pv-dot{background:#f2b33d;box-shadow:0 0 0 0 rgba(242,179,61,.6)}
.pv-t{display:flex;flex-direction:column;line-height:1.1;min-width:0}.pv-t small{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.pv-t b{font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pvbar.flip .pv-t{transform-origin:left center;animation:pvTxt .45s var(--grow)}
.pv-b{position:relative;flex:none;width:34px;height:34px;display:grid;place-items:center;border:0;border-radius:50%;padding:0;font:600 .86rem var(--body);background:var(--sunk);color:var(--fg);cursor:pointer;transition:background .3s var(--ease),color .3s var(--ease),transform .2s var(--ease)}
.pv-b:active{transform:scale(.9)}
.pv-pen svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.pv-pen[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.pv-pen[aria-pressed=true] .pen-b,.pv-pen[aria-pressed=true] .pen-t{transform-box:view-box;transform-origin:4px 20px;animation:penWrite .56s var(--grow)}
.pv-pen[aria-pressed=true] .pen-l{stroke-dasharray:8;stroke-dashoffset:8;animation:penLine .5s var(--ease) .25s forwards}
.pv-pen[aria-pressed=false] .pen-l{opacity:0}
.pv-x{margin-left:2px}.pv-x:hover{background:color-mix(in srgb,#d9534f 22%,var(--sunk))}
@keyframes pvIn{from{opacity:0;transform:scale(.6)}}
@keyframes pvOut{to{opacity:0;transform:scale(.6)}}
@keyframes pvSweep{from{transform:translateX(-120%)}to{transform:translateX(120%)}}
@keyframes pvTxt{from{opacity:0;transform:scale(.82)}}
@keyframes pvDot{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}70%,100%{box-shadow:0 0 0 7px transparent}}
@keyframes penWrite{from{transform:scale(.6)}}
@keyframes penLine{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.pvbar,.pvbar *,.pvbar::after{animation:none!important}}
.ib.dl{color:var(--fg)}.ib.dl.busy{opacity:.45;pointer-events:none;animation:ghpulse 1s ease-in-out infinite}
.pdfchip{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;border-radius:14px;background:var(--sunk);color:var(--fg);text-decoration:none;border:1px solid transparent}
.pdfchip:hover{border-color:var(--line)}
.pdfchip .pi{flex:none;width:34px;height:40px;color:var(--danger)}
.pdfchip span{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.pdfchip b{font-weight:600;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pdfchip small{color:var(--muted);font-size:.76rem}
.pdfchip .go{margin-left:auto;flex:none;font:600 .78rem var(--body);color:var(--accent)}
.nopdf{display:block;color:var(--muted);font-size:.85rem;padding:9px 12px;border-radius:14px;border:1px dashed var(--line)}
.apdf{grid-column:2/-1;margin-top:6px}
.aact{align-items:center}
.docs{padding:0 16px 16px;display:flex;flex-direction:column;gap:8px}
.docs h3{font:700 .72rem var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:6px 0 0}
.rstat{grid-column:2/-1;display:flex;align-items:center;gap:4px 10px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-top:6px;line-height:1.3}
.rstat.ok b{color:var(--accent);font-weight:700}.rstat.err{color:var(--danger)}
.rstat .lnk{border:0;background:none;color:var(--accent);font:600 .82rem var(--body);padding:6px 0;min-height:34px;text-decoration:underline;text-underline-offset:3px}
.rstat .sp{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);border-right-color:transparent;animation:spin .8s linear infinite;flex:none}
.dp-btns{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.pfbtn{display:inline-flex;align-items:center;gap:8px;min-height:42px}
.pfbtn svg{width:20px;height:20px}
.pf-top{padding:6px 56px 0 2px}
.pf-h{font:700 2.1rem/1 var(--display);margin:0}.pf-c{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.pf-sh{font:700 1.3rem/1.1 var(--display);margin:0}
.gen-f{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}

- El color de fondo de cada celda de comida es el color del menú: verde, naranja, rojo o gris (gris claro). Si la celda tiene color pero no tiene texto, esa comida es «Opciones verdes», «Opciones naranjas», «Opciones rojas» u «Opciones grises» según su color. Si una celda tiene «-» o está vacía sin color, esa comida no existe ese día.
- Si hay una tabla aparte de entrenamiento, úsala para el entreno de cada día; si hay una tabla de lo que se toma durante el entreno (intra-entreno) por minutos, resúmela en "intra" con una línea por tiempo (por ejemplo «20': trago de isotónico») y una línea final con los gramos de hidratos si aparecen.
- Si las filas de durante y post-entreno están antes de la comida, el entreno es por la mañana ("when":"am"); si están después de la merienda, por la tarde ("pm").
- Ignora la información general (presentación, recomendaciones, tablas de equivalencias, grupos de fruta): solo interesa lo de cada día.
- Escribe los campos en castellano. Si el PDF está en euskera u otro idioma, tradúcelo fielmente (cantidades, alimentos y tiempos exactos).
- Además, cada día lleva "eu": los mismos textos en euskera (title, detail, zone, desayuno, mediamanana, comida, merienda, cena, intra, post; solo los que tenga el día). Si el PDF está en euskera, copia el texto original tal cual; si no, tradúcelo al euskera. Las comidas que sean solo «Opciones <color>» no hace falta ponerlas en "eu".

Fechas: hoy es ${today} y el lunes de esta semana es ${mon}.

    for(const d of Array.isArray(w.days)?w.days:[]){const i=Number(d&&d.d);if(!Number.isInteger(i)||i<0||i>6)continue;
      const o={...(P.days[i]||{}),d:i};let k=(Array.isArray(d.kinds)?d.kinds:[]).filter(x=>KIND_OK.has(x));if(k.length>1)k=k.filter(x=>x!=="rest");

      for(const f of ["title"])if(S(d[f],60))o[f]=S(d[f],60);
      for(const f of ["detail"])if(S(d[f],1500))o[f]=S(d[f],1500);
      for(const f of ["zone"])if(S(d[f],40))o[f]=S(d[f],40);
      for(const f of ["desayuno","mediamanana","comida","merienda","cena","intra","post"])if(S(d[f],600))o[f]=S(d[f],600);
      const m=Math.round(Number(d.min));if(m>0&&m<=600)o.min=m;

    document.querySelectorAll("#devPage .arow.open").forEach(x=>{if(x!==art){x.classList.remove("open");const hb=x.querySelector("[data-tog]");if(hb)hb.setAttribute("aria-expanded","false")}});
    art.classList.toggle("open",op);b.setAttribute("aria-expanded",String(op));return}
  if(b.dataset.eye){const id=b.dataset.eye;shown.has(id)?shown.delete(id):shown.add(id);renderDevPage();return}
  if(b.dataset.copy){const a=accounts[b.dataset.copy];if(!a)return;
    try{await navigator.clipboard.writeText(`SENDO\n${t("yourName")}: ${a.nombre}\n${t("pass")}: ${a.clave}`);toast(t("copied"))}catch(err){toast(t("copyErr"))}return}
  if(b.dataset.up){pickPdf({kind:"acc",id:b.dataset.up},b);return}
  if(b.dataset.info){pickPdf({kind:"info",id:b.dataset.info},b);return}
  if(b.dataset.antro){pickPdf({kind:"antro",id:b.dataset.antro},b);return}
  if(b.dataset.hide){const id=b.dataset.hide,a=accounts[id];if(!a)return;const n={...a};if(a.oculta)delete n.oculta;else n.oculta=true;
    try{await db.doc("cuentas/"+id).set(n);toast(t(n.oculta?"hiddenOk":"shownOk"))}catch(err){toast(t("saveErr"))}return}
  if(b.dataset.rmpdf){removePdf("acc",b.dataset.rmpdf);return}
  if(b.dataset.pdfs){pdfView={kind:"acc",id:b.dataset.pdfs};show("pdfs");return}
  if(b.dataset.reread){readPlanPdf(b.dataset.reread,null);return}
  if(b.dataset.diary){editing=true;preview=true;pvMode=true;watchPlan(b.dataset.diary);wkOffset=0;show("edit");return}
  if(b.dataset.edit)editAccount(b.dataset.edit)};

function genPass(){const S="ba be bi bo bu da de di do ka ke ki ko ku la le li lo lu ma me mi mo mu na ne ni no pa pe pi po ra re ri ro sa se si so ta te ti to za zo".split(" "),r=n=>Math.floor(Math.random()*n);
  let s="";for(let i=0;i<3;i++)s+=S[r(S.length)];return s+String(10+r(90))}
function editAccount(id){
  const a=id?accounts[id]:null,G=Object.entries(grps).sort((x,y)=>String(x[1].nombre).localeCompare(String(y[1].nombre),"es"));
  const g0=a?grpsOf(a):(grpFilter&&grpFilter!=="-"&&grps[grpFilter]?[grpFilter]:[]);
  const card=sheet(a?t("editAcc"):t("newAcc"),`<label class="f">${esc(t("yourName"))}<input id="aN" maxlength="60" autocomplete="off" value="${esc(a?a.nombre:"")}"></label>
    <label class="f">${esc(t("pass"))}<span class="pwrow"><input id="aP" maxlength="40" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(a?a.clave:genPass())}"><button type="button" class="ghost" id="aG">${esc(t("gen"))}</button></span></label>
    ${G.length?`<div class="f"><span>${esc(t("grpField"))}</span><div class="gpick" id="aGrp">${G.map(([k,g])=>`<button type="button" class="chip" data-g="${esc(k)}" style="--gc:${esc(gcol(k))}" aria-pressed="${g0.includes(k)}"><i></i>${esc(g.nombre)}</button>`).join("")}</div><span class="f-hint">${esc(t("grpHint"))}</span></div>`:""}`,
    async c=>{const n=c.querySelector("#aN").value.trim().replace(/\s+/g," "),p=c.querySelector("#aP").value.trim();
      if(!n){toast(t("needName"));c.querySelector("#aN").focus();return false}
      if(Object.entries(accounts).some(([k,x])=>k!==id&&norm(x.nombre)===norm(n))){toast(t("dupName"));return false}
      if(p.length<4){toast(t("shortPw"));return false}
      const nid=id||("c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
      const gv=[...c.querySelectorAll("#aGrp [data-g][aria-pressed=true]")].map(x=>x.dataset.g).filter(g=>grps[g]),d={...(a||{}),nombre:n.slice(0,60),clave:p.slice(0,40),alta:a&&a.alta||new Date().toISOString()};
      const keep=grpList(a).filter(g=>gv.includes(g)),gl=[...keep,...gv.filter(g=>!keep.includes(g))];delete d.grupo;if(gl.length)d.grupos=gl;else delete d.grupos;
      try{await db.doc("cuentas/"+nid).set(d);shown.add(nid);toast(t("accSaved"))}
      catch(e){toast(t("saveErr"));return false}},
    a?()=>{setTimeout(()=>sheet(t("delAcc"),`<p style="margin:0">${esc(t("delConfirm").replace("{n}",a.nombre))}</p>`,
      async()=>{try{await db.doc("cuentas/"+id).delete();shown.delete(id);if(assets)for(const f of [...accPdfs(a),...accInfos(a),...accAntros(a)])if(f&&f.id)try{await assets.delete(f.id)}catch(e){}toast(t("accDeleted"))}catch(e){toast(t("saveErr"))}},null,null,{save:t("delAcc")}),240)}:null,
    "#aN",{clear:t("delAcc")});
  card.querySelector("#aG").onclick=()=>{card.querySelector("#aP").value=genPass()};
  card.querySelectorAll("#aGrp [data-g]").forEach(b=>b.onclick=()=>b.setAttribute("aria-pressed",String(b.getAttribute("aria-pressed")!=="true")))}

function editGroup(id){
  const g=id?grps[id]:null,used=new Set(Object.values(grps).map(x=>x.color));let col=g&&g.color||GCOL.find(c=>!used.has(c))||GCOL[Object.keys(grps).length%GCOL.length];
  const card=sheet(g?t("editGrp"):t("newGrp"),`<label class="f">${esc(t("grpName"))}<input id="gN" maxlength="40" autocomplete="off" value="${esc(g?g.nombre:"")}"></label>
    <div class="f"><span>${esc(t("grpColor"))}</span><div class="gcols">${GCOL.map(c=>`<button type="button" class="gc" data-c="${c}" style="--gc:${c}" aria-pressed="${c===col}" aria-label="${c}"></button>`).join("")}</div></div>
    <p class="f-hint">${esc(g?grpN(grpCount(id))+" · "+t("grpSub"):t("grpSub"))}</p>`,
    async c=>{const n=c.querySelector("#gN").value.trim().replace(/\s+/g," ");
      if(!n){toast(t("needGrpName"));c.querySelector("#gN").focus();return false}
      if(Object.entries(grps).some(([k,x])=>k!==id&&norm(x.nombre)===norm(n))){toast(t("dupGrp"));return false}
      const nid=id||("g"+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
      try{await db.doc("grupos/"+nid).set({...(g||{}),nombre:n.slice(0,40),color:col,alta:g&&g.alta||new Date().toISOString()});toast(t("grpSaved"))}
      catch(e){toast(t("saveErr"));return false}},
    g?()=>{setTimeout(()=>sheet(t("delGrp"),`<p style="margin:0">${esc(t("delGrpConfirm").replace("{n}",g.nombre))}</p>`,
      async()=>{try{for(const[k,a]of Object.entries(accounts))if(grpList(a).includes(id)){const n={...a},l=grpList(a).filter(x=>x!==id);delete n.grupo;if(l.length)n.grupos=l;else delete n.grupos;await db.doc("cuentas/"+k).set(n)}
          try{const W=await weeksOnce(id,"gplanes");for(const k of Object.keys(W))await db.doc(`gplanes/${id}/semanas/${k}`).delete()}catch(e){}
          await db.doc("grupos/"+id).delete();if(assets)for(const f of accPdfs(g))if(f&&f.id)try{await assets.delete(f.id)}catch(e){}
          if(grpFilter===id)grpFilter="";toast(t("grpDeleted"))}catch(e){toast(t("saveErr"))}},null,null,{save:t("delGrp")}),240)}:null,
    "#gN",{clear:t("delGrp")});
  card.querySelectorAll(".gc").forEach(b=>b.onclick=()=>{col=b.dataset.c;card.querySelectorAll(".gc").forEach(x=>x.setAttribute("aria-pressed",String(x===b)))})}

/* «Ver diario»: la cuenta tal como la ve el cliente. Pestaña arriba con un lápiz (editar sí/no) y la ✕, que es la única salida */
function renderPv(){let b=$("pvBar");const on=access==="edit"&&pvMode&&!!client;document.body.classList.toggle("pv",on);
  if(!on){if(b){b.classList.add("out");setTimeout(()=>b.remove(),260)}return}
  if(!b||b.classList.contains("out")){if(b)b.remove();b=document.createElement("div");b.id="pvBar";b.className="pvbar";document.body.append(b)}
  const a=accounts[client];b.classList.toggle("on",!preview);
  b.innerHTML=`<span class="pv-dot" aria-hidden="true"></span><span class="pv-t"><small>${esc(t(preview?"pvLabel":"pvEditing"))}</small><b>${esc(a?a.nombre:"—")}</b></span><button type="button" class="pv-b pv-pen" id="pvEdit" aria-pressed="${!preview}" aria-label="${esc(t("pvEdit"))}" title="${esc(t("pvEdit"))}"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="pen-b" d="M4 20l1-4.2L15.6 5.2a2 2 0 0 1 2.8 0l.4.4a2 2 0 0 1 0 2.8L8.2 19 4 20z"/><path class="pen-t" d="M13.8 7l3.2 3.2"/><path class="pen-l" d="M4 20h7"/></svg></button><button type="button" class="pv-b pv-x" id="pvClose" aria-label="${esc(t("backAcc"))}" title="${esc(t("backAcc"))}">✕</button>`;
  $("pvEdit").onclick=()=>{preview=!preview;canEdit=!preview&&!!client;renderPv();const pb=$("pvBar");if(pb){pb.classList.remove("flip");void pb.offsetWidth;pb.classList.add("flip")}renderWeek()};
  $("pvClose").onclick=()=>show("dev")}
function renderDev(){
  const box=$("devBox");if(!box)return;if(!editing||pvMode){$("devSec").hidden=true;return}
  const a=accounts[client];
  box.innerHTML=`<div class="sechead"><div><div class="sub">${esc(t("editing"))}</div><h2>${esc(a?a.nombre:"—")}</h2></div></div>
    <div class="wkfoot"><button type="button" class="ghost" id="backAcc">← ${esc(t("backAcc"))}</button></div>`;
  $("backAcc").onclick=()=>show("dev")}

const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64e=u=>btoa(String.fromCharCode(...u));
async function appKey(name,pass){const E=new TextEncoder(),base=await crypto.subtle.importKey("raw",E.encode(pass),"PBKDF2",false,["deriveBits"]);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:E.encode("sendo|"+norm(name)),iterations:APP.iter},base,384));
  return{raw:bits.slice(0,32),id:[...bits.slice(32,48)].map(b=>b.toString(16).padStart(2,"0")).join("")}}
async function appFetch(id){const r=await fetch(`${APP.base}c/${id}.json?t=${Date.now()}`,{cache:"no-store"});if(r.status===404)return null;if(!r.ok)throw new Error("net");return r.json()}
async function appOpen(raw,box){const k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(box.iv)},k,b64d(box.ct))))}
function b64big(u){let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
function avisos(d){const N=window.SendoNative;if(!APP||!N)return;try{if(!d){if(N.unregister)N.unregister();return}
  const s=JSON.parse(LS.get("sendo.app")||"null");if(s&&N.register)N.register(APP.base,s.id,s.k,JSON.stringify(Object.keys(d.semanas||{})),LANG)}catch(e){}}
function appApply(d){appData=d;avisos(d);const id=d.id||"yo";accounts={[id]:{nombre:d.nombre||""}};gens={};watchPlan(id);if(inside()){renderDocs();renderWeek()}}
async function appLogin(){
  const n=$("accName").value,pw=$("accPass").value;loginName=n;if(!norm(n)||!pw){toast(t("badLogin"));return}
  const g=$("accGo");g.disabled=true;
  try{const K=await appKey(n,pw);let box;try{box=await appFetch(K.id)}catch(e){toast(t("netErr"));return}
    if(!box){toast(t("badLogin"));$("accPass").select();return}
    let d;try{d=await appOpen(K.raw,box)}catch(e){toast(t("badLogin"));return}
    LS.set("sendo.app",JSON.stringify({id:K.id,k:b64e(K.raw)}));LS.set("sendo.cache",JSON.stringify(box));$("accPass").value="";appApply(d);show("app")}
  finally{const b=$("accGo");if(b)b.disabled=false}}
async function appRefresh(first){
  let s=null;try{s=JSON.parse(LS.get("sendo.app")||"null")}catch(e){}
  if(!s||!s.id){if(first)show("login");return}
  const raw=b64d(s.k);
  if(first){let box,net=true;
    try{box=await Promise.race([appFetch(s.id),new Promise((_,ko)=>setTimeout(()=>ko(new Error("lento")),6000))])}catch(e){net=false}
    if(net){if(!box){LS.set("sendo.app","");LS.set("sendo.cache","");appData=null;avisos(null);show("login");return}  // cuenta borrada u oculta: fuera
      try{LS.set("sendo.cache",JSON.stringify(box));appApply(await appOpen(raw,box));show("app")}catch(e){show("login")}return}
    // sin conexión: el último plan descargado, y se vuelve a comprobar en cuanto se pueda
    try{const c=JSON.parse(LS.get("sendo.cache")||"null");if(c){appApply(await appOpen(raw,c));show("app");setTimeout(()=>appRefresh(false),4000);return}}catch(e){}
    show("login");return}
  try{const box=await appFetch(s.id);
    if(!box){LS.set("sendo.app","");LS.set("sendo.cache","");appData=null;avisos(null);show("login");return}
    LS.set("sendo.cache",JSON.stringify(box));appApply(await appOpen(raw,box));if(access==="loading")show("app")}
  catch(e){if(access==="loading")show(appData?"app":"login")}}
window.sendoBack=()=>{const sh=document.querySelector(".sheet");if(sh){const c=sh.querySelector("[data-cancel]");if(c)c.click();return true}
  if(pvMode&&access==="edit"){if(inside()&&tab==="nut")setTab("plan",true);return true}
  if(access==="edit"||access==="pdfs"){show("dev");return true}
  if(DEVAPP&&access==="dev"){const rb=$("rootsBg");if(rb)rb.remove();show("app");return true}
  if(inside()&&tab==="nut"){setTab("plan",true);return true}
  if(inside()){goHome();return true}return false};
if(APP){document.addEventListener("visibilitychange",()=>{if(!document.hidden&&appData)appRefresh(false)});setInterval(()=>{if(!document.hidden&&appData)appRefresh(false)},5*60e3)}
(async()=>{
  if(APP){isDev=false;appRefresh(true);return}
  if(DEVAPP&&!LS.get("sendo.gh")&&!DEVAPP.token){show("ghsetup");return}
  const giveUp=setTimeout(()=>{if(access==="loading")show("nodb")},10000);
  try{
    const user=await claude.use("user");db=await claude.use("db");
    if(!db||!user){clearTimeout(giveUp);show("nodb");return}
    let own=false,ed=false;try{own=!!(await user.isOwner())}catch(e){}try{ed=!!(await user.canEdit())}catch(e){}
    isDev=own||ed;
    if(!isDev){clearTimeout(giveUp);show("blocked");return}
    try{assets=await claude.use("assets")}catch(e){assets=null}
    db.collection("general").onSnapshot(q=>{const o={};q.docs.forEach(d=>{o[d.id]=d.data()});gens=o;if(access==="dev")renderGen();renderPdfPage();if(inside())renderDocs()},()=>{});
    db.collection("grupos").onSnapshot(q=>{const o={};q.docs.forEach(d=>{o[d.id]=d.data()});grps=o;renderDevPage();renderPdfPage()},()=>{});
    let first=true;
    db.collection("cuentas").onSnapshot(q=>{const o={};q.docs.forEach(d=>{o[d.id]=d.data()});accounts=o;
      if(first){first=false;clearTimeout(giveUp);const s=LS.get("sendo.sess");
        if(DEVAPP)show("app");else if(LS.get("sendo.dev"))show("dev");else if(s&&accounts[s]){watchPlan(s);show("app")}else show("login");return}
      if(client&&!accounts[client]){if(access==="app"){LS.set("sendo.sess","");watchPlan(null);show("login")}else if(access==="edit")show("dev")}
      renderDevPage();renderPdfPage();if(inside()){renderDev();renderDocs();renderWeek()}},()=>{clearTimeout(giveUp);show("nodb")});
  }catch(e){clearTimeout(giveUp);show("nodb")}
})();
})();
